server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dynamic sitemap routing based on Host header
    location = /sitemap.xml {
        if ($http_host ~* "nevatal\.tech") {
            rewrite ^ /sitemap-tech.xml break;
        }
        if ($http_host ~* "nevatal\.id") {
            rewrite ^ /sitemap-id.xml break;
        }
        try_files /sitemap.xml =404;
    }

    # Dynamic robots.txt routing based on Host header
    location = /robots.txt {
        if ($http_host ~* "nevatal\.tech") {
            rewrite ^ /robots-tech.txt break;
        }
        if ($http_host ~* "nevatal\.id") {
            rewrite ^ /robots-id.txt break;
        }
        try_files /robots.txt =404;
    }

    # SPA routing - fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
